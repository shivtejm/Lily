<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lily – Your Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #f0eef5;
      padding: 0;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(192, 132, 252, 0.3);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 12px;
      color: #a8a3b8;
      margin: 2px 0 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #6b6580;
      margin: 20px 0 10px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #a8a3b8;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #f0eef5;
      font-family: inherit;
      font-size: 13px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }
    select {
      cursor: pointer;
    }
    select option {
      background: #1a1640;
      color: #f0eef5;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(192, 132, 252, 0.5);
      box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.1);
    }
    input::placeholder, textarea::placeholder {
      color: #6b6580;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      color: #1a1640;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      font-family: inherit;
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      border-radius: 10px;
      color: #a8a3b8;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #f0eef5;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.3s;
    }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    .hint {
      font-size: 10px;
      color: #6b6580;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">⚡</div>
      <div>
        <h1>Lily Profile</h1>
        <p>Tell Lily about yourself so she can fill forms for you.</p>
      </div>
    </div>

    <!-- Personal Info -->
    <div class="glass">
      <div class="section-title">Personal Information</div>
      <div class="row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="John">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Doe">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="+91 98765 43210">
      </div>
      <div class="row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Marital Status</label>
          <select id="maritalStatus">
            <option value="">Select</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nationality</label>
          <input type="text" id="nationality" placeholder="Indian">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Father's Name</label>
          <input type="text" id="fatherName" placeholder="Mr. Doe">
        </div>
        <div class="form-group">
          <label>Mother's Name</label>
          <input type="text" id="motherName" placeholder="Mrs. Doe">
        </div>
      </div>
    </div>

    <!-- Identity Documents -->
    <div class="glass">
      <div class="section-title">Identity Documents</div>
      <div class="row">
        <div class="form-group">
          <label>Aadhaar Number</label>
          <input type="text" id="aadhaar" placeholder="1234 5678 9012" maxlength="14">
          <div class="hint">12-digit number</div>
        </div>
        <div class="form-group">
          <label>PAN Number</label>
          <input type="text" id="pan" placeholder="ABCDE1234F" maxlength="10" style="text-transform: uppercase;">
          <div class="hint">10-character alphanumeric</div>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Passport Number</label>
          <input type="text" id="passport" placeholder="A1234567" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label>Voter ID</label>
          <input type="text" id="voterId" placeholder="ABC1234567" style="text-transform: uppercase;">
        </div>
      </div>
      <div class="form-group">
        <label>Driving License Number</label>
        <input type="text" id="drivingLicense" placeholder="MH01-2020-0012345" style="text-transform: uppercase;">
      </div>
    </div>

    <!-- Address -->
    <div class="glass">
      <div class="section-title">Address</div>
      <div class="form-group">
        <label>Street Address</label>
        <input type="text" id="address" placeholder="123 Main Street, Apt 4B">
      </div>
      <div class="row-3">
        <div class="form-group">
          <label>City</label>
          <input type="text" id="city" placeholder="Mumbai">
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" id="state" placeholder="Maharashtra">
        </div>
        <div class="form-group">
          <label>PIN Code</label>
          <input type="text" id="zip" placeholder="400001" maxlength="6">
        </div>
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" id="country" placeholder="India">
      </div>
    </div>

    <!-- Professional -->
    <div class="glass">
      <div class="section-title">Professional</div>
      <div class="form-group">
        <label>LinkedIn URL</label>
        <input type="text" id="linkedin" placeholder="https://linkedin.com/in/johndoe">
      </div>
      <div class="form-group">
        <label>Portfolio / GitHub URL</label>
        <input type="text" id="portfolio" placeholder="https://github.com/johndoe">
      </div>
      <div class="row">
        <div class="form-group">
          <label>Current Company</label>
          <input type="text" id="company" placeholder="Acme Corp">
        </div>
        <div class="form-group">
          <label>Job Title / Designation</label>
          <input type="text" id="jobTitle" placeholder="Software Engineer">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Years of Experience</label>
          <input type="text" id="experience" placeholder="3">
        </div>
        <div class="form-group">
          <label>Current CTC (LPA)</label>
          <input type="text" id="currentCtc" placeholder="8.5">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Expected CTC (LPA)</label>
          <input type="text" id="expectedCtc" placeholder="12">
        </div>
        <div class="form-group">
          <label>Notice Period (Days)</label>
          <input type="text" id="noticePeriod" placeholder="30">
        </div>
      </div>
      <div class="form-group">
        <label>Skills (comma-separated)</label>
        <textarea id="skills" placeholder="JavaScript, React, Python, SQL, Docker"></textarea>
      </div>
    </div>

    <!-- Education -->
    <div class="glass">
      <div class="section-title">Education</div>
      <div class="form-group">
        <label>Highest Qualification</label>
        <select id="qualification">
          <option value="">Select</option>
          <option value="10th">10th</option>
          <option value="12th">12th / Intermediate</option>
          <option value="Diploma">Diploma</option>
          <option value="B.Tech">B.Tech / B.E.</option>
          <option value="B.Sc">B.Sc</option>
          <option value="B.Com">B.Com</option>
          <option value="BBA">BBA</option>
          <option value="BCA">BCA</option>
          <option value="B.A.">B.A.</option>
          <option value="M.Tech">M.Tech / M.E.</option>
          <option value="M.Sc">M.Sc</option>
          <option value="MBA">MBA</option>
          <option value="MCA">MCA</option>
          <option value="M.A.">M.A.</option>
          <option value="Ph.D">Ph.D</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>University / Institute</label>
        <input type="text" id="university" placeholder="IIT Delhi">
      </div>
      <div class="row">
        <div class="form-group">
          <label>Year of Passing</label>
          <input type="text" id="passingYear" placeholder="2022">
        </div>
        <div class="form-group">
          <label>CGPA / Percentage</label>
          <input type="text" id="cgpa" placeholder="8.5 / 85%">
        </div>
      </div>
      <div class="form-group">
        <label>Specialization / Branch</label>
        <input type="text" id="specialization" placeholder="Computer Science & Engineering">
      </div>
    </div>

    <!-- Additional -->
    <div class="glass">
      <div class="section-title">Additional Information</div>
      <div class="row">
        <div class="form-group">
          <label>Languages Known</label>
          <input type="text" id="languages" placeholder="English, Hindi, Tamil">
        </div>
        <div class="form-group">
          <label>Blood Group</label>
          <select id="bloodGroup">
            <option value="">Select</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Emergency Contact Name</label>
          <input type="text" id="emergencyName" placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label>Emergency Contact Phone</label>
          <input type="text" id="emergencyPhone" placeholder="+91 98765 43211">
        </div>
      </div>
      <div class="form-group">
        <label>Resume / CV URL</label>
        <input type="text" id="resumeUrl" placeholder="https://drive.google.com/file/...">
      </div>
    </div>

    <!-- Actions -->
    <div class="btn-group">
      <button class="btn-primary" id="saveBtn">💾 Save Profile</button>
      <button class="btn-secondary" id="clearBtn">Clear All</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
